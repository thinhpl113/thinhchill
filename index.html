<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính Tuổi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .input-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 12px;
            font-size: 1.1em;
            font-weight: 600;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 18px 20px;
            font-size: 1.2em;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            outline: none;
            transition: all 0.3s ease;
            background: #f8f9fa;
            color: #333;
        }

        input:focus {
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        input::placeholder {
            color: #aaa;
        }

        .calculate-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.2em;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            margin-bottom: 30px;
        }

        .calculate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .calculate-btn:active {
            transform: translateY(-1px);
        }

        .result {
            margin-top: 30px;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            color: white;
            display: none;
            animation: slideUp 0.5s ease-out;
        }

        .result.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-label {
            font-size: 1em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 3em;
            font-weight: 700;
            margin: 10px 0;
        }

        .result-unit {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .error {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 0.95em;
            display: none;
            animation: shake 0.5s;
        }

        .error.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 2em;
            }

            .result-value {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎂 Máy Tính Tuổi</h1>
        <p class="subtitle">Nhập năm sinh của bạn để tính tuổi</p>
        
        <div class="input-group">
            <label for="birthYear">Năm sinh của bạn:</label>
            <input 
                type="number" 
                id="birthYear" 
                placeholder="Ví dụ: 1990"
                min="1900"
                max="2100"
            >
            <div class="error" id="error"></div>
        </div>

        <button class="calculate-btn" onclick="calculateAge()">
            Tính Tuổi
        </button>

        <div class="result" id="result">
            <div class="result-label">Tuổi của bạn là:</div>
            <div class="result-value" id="ageValue">0</div>
            <div class="result-unit">tuổi</div>
        </div>

        <div class="footer">
            Made with ❤️
        </div>
    </div>

    <script>
        function calculateAge() {
            const birthYearInput = document.getElementById('birthYear');
            const resultDiv = document.getElementById('result');
            const ageValue = document.getElementById('ageValue');
            const errorDiv = document.getElementById('error');
            
            const birthYear = parseInt(birthYearInput.value);
            const currentYear = new Date().getFullYear();
            
            // Ẩn kết quả và lỗi trước
            resultDiv.classList.remove('show');
            errorDiv.classList.remove('show');
            
            // Kiểm tra dữ liệu đầu vào
            if (!birthYearInput.value || isNaN(birthYear)) {
                errorDiv.textContent = 'Vui lòng nhập năm sinh hợp lệ!';
                errorDiv.classList.add('show');
                return;
            }
            
            if (birthYear < 1900 || birthYear > currentYear) {
                errorDiv.textContent = `Năm sinh phải từ 1900 đến ${currentYear}!`;
                errorDiv.classList.add('show');
                return;
            }
            
            // Tính tuổi
            const age = currentYear - birthYear;
            
            // Hiển thị kết quả với animation
            ageValue.textContent = age;
            setTimeout(() => {
                resultDiv.classList.add('show');
            }, 100);
        }

        // Cho phép nhấn Enter để tính
        document.getElementById('birthYear').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateAge();
            }
        });

        // Tự động focus vào ô input khi trang load
        window.addEventListener('load', function() {
            document.getElementById('birthYear').focus();
        });
    </script>
</body>
</html>
