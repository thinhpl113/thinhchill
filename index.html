<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photobooth Hàn Quốc</title>
  <style>
    :root {
      --bg: #121016;
      --surface: #1e1728;
      --surface-soft: #292034;
      --text: #f6f3ff;
      --muted: #c0b5d9;
      --accent: #f15ae3;
      --accent-2: #8f86ff;
      --border: rgba(255,255,255,.12);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      font-family: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(241,90,227,.2), transparent 24%),
                  radial-gradient(circle at bottom right, rgba(143,134,255,.18), transparent 22%),
                  linear-gradient(180deg, #0b0812 0%, #121016 48%, #17131f 100%);
      display: flex;
      justify-content: center;
      padding: 18px;
    }

    .page {
      width: min(1400px, 100%);
      display: grid;
      gap: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .title {
      display: grid;
      gap: 10px;
      flex: 1 1 320px;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      letter-spacing: .03em;
    }

    .title p {
      margin: 0;
      color: var(--muted);
      max-width: 720px;
      line-height: 1.6;
    }

    .top-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .top-bar button,
    .top-bar select,
    .top-bar input[type=text] {
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      padding: 12px 18px;
      background: rgba(255,255,255,.05);
      color: var(--text);
      font: 500 0.95rem/1.2 'Inter', sans-serif;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    .top-bar input[type=text] {
      min-width: 200px;
      background: rgba(255,255,255,.06);
    }

    .top-bar button:hover,
    .top-bar select:hover,
    .top-bar input[type=text]:hover {
      transform: translateY(-1px);
      border-color: rgba(241,90,227,.6);
    }

    .content {
      display: grid;
      gap: 24px;
      grid-template-columns: 1fr 360px;
    }

    .panel,
    .strip-card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 1.1rem;
      color: var(--muted);
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .mode-tabs button {
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: rgba(255,255,255,.04);
      color: var(--text);
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color .2s ease, background .2s ease;
    }

    .mode-tabs button.active {
      background: linear-gradient(135deg, rgba(241,90,227,.18), rgba(143,134,255,.16));
      border-color: rgba(241,90,227,.7);
    }

    .preview-card {
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      background: radial-gradient(circle at center, rgba(255,255,255,.06), transparent 62%);
      border: 1px solid rgba(255,255,255,.12);
      min-height: 520px;
      display: grid;
      place-items: center;
    }

    .preview-card video,
    .preview-card canvas {
      width: 100%;
      height: auto;
      max-height: 560px;
      display: block;
      object-fit: cover;
    }

    .preview-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .countdown,
    .flash {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: clamp(3rem, 6vw, 6rem);
      font-weight: 800;
      text-shadow: 0 0 28px rgba(255,255,255,.45);
      opacity: 0;
    }

    .countdown.show,
    .flash.show {
      opacity: 1;
    }

    .flash {
      background: rgba(255,255,255,.65);
      animation: flash .4s ease-out;
    }

    @keyframes flash {
      from { opacity: 0.9; }
      to { opacity: 0; }
    }

    .controls {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      margin-top: 18px;
    }

    .controls button {
      border-radius: 16px;
      padding: 15px 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    .controls button.primary {
      background: linear-gradient(135deg, #f15ae3, #8f86ff);
      border-color: transparent;
      color: #fff;
    }

    .controls button:hover {
      transform: translateY(-1px);
    }

    .inputs {
      display: grid;
      gap: 14px;
      margin-top: 24px;
    }

    label { display: grid; gap: 8px; font-size: .95rem; color: var(--muted); }
    input[type=file] { display: none; }

    .filters,
    .adjustments {
      display: grid;
      gap: 12px;
    }

    .filters button,
    .layout-controls button {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 16px;
      padding: 12px 14px;
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease;
    }

    .filters button.active,
    .layout-controls button.active {
      border-color: rgba(241,90,227,.7);
      background: rgba(241,90,227,.14);
    }

    .range-row {
      display: grid;
      gap: 12px;
    }

    .range-row input[type=range] {
      width: 100%;
      accent-color: #f15ae3;
    }

    .photostrip {
      display: grid;
      gap: 18px;
    }

    .strip-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .strip-title h3 {
      margin: 0;
      font-size: 1rem;
      color: var(--muted);
    }

    .strip-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr;
      max-height: 720px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .photo-item {
      border: 12px solid #fff;
      border-radius: 22px;
      overflow: hidden;
      position: relative;
      background: #111;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .photo-item.selected {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(241,90,227,.18);
    }

    .photo-item img {
      width: 100%;
      display: block;
      object-fit: cover;
      aspect-ratio: 3 / 4;
    }

    .photo-item .label {
      position: absolute;
      inset: auto 0 0 0;
      padding: 10px 14px;
      color: #fff;
      background: rgba(0,0,0,.35);
      text-align: center;
      font-size: .85rem;
    }

    .layout-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 10px;
      width: 100%;
    }

    .caption-box {
      display: grid;
      gap: 10px;
    }

    .caption-box input {
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      padding: 14px 16px;
      color: var(--text);
    }

    .hint {
      font-size: .84rem;
      color: var(--muted);
      margin-top: 6px;
    }

    @media (max-width: 1080px) {
      .content { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      body { padding: 12px; }
      .page { gap: 18px; }
      .top-bar { flex-direction: column; align-items: stretch; }
      .controls { grid-template-columns: 1fr; }
      .layout-controls { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="title">
        <h1>Photobooth Hàn Quốc</h1>
        <p>Chụp, upload, chỉnh sửa và xuất photostrip phong cách studio Hàn Quốc — tất cả trong một trang duy nhất.</p>
      </div>
      <div class="top-bar">
        <input id="captionText" type="text" placeholder="Caption..." />
        <select id="layoutSelect">
          <option value="2">2 ảnh</option>
          <option value="4" selected>4 ảnh</option>
          <option value="6">6 ảnh</option>
        </select>
        <button id="downloadStrip" type="button">Tải ảnh</button>
        <button id="deletePhoto" type="button">Xóa</button>
      </div>
    </header>

    <section class="content">
      <div class="panel">
        <h2>Preview</h2>
        <div class="mode-tabs">
          <button id="modeWebcam" class="active" type="button">Webcam</button>
          <button id="modeUpload" type="button">Upload</button>
        </div>

        <div class="preview-card">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="canvas"></canvas>
          <div class="preview-overlay">
            <div id="countdown" class="countdown"></div>
            <div id="flash" class="flash"></div>
          </div>
        </div>

        <div class="controls">
          <button id="captureBtn" class="primary" type="button">Chụp ảnh</button>
          <label for="uploadInput"><button type="button">Upload ảnh</button></label>
          <input id="uploadInput" type="file" accept="image/*" multiple />
          <button id="rotateBtn" type="button">Xoay</button>
          <button id="resetBtn" type="button">Reset</button>
        </div>

        <div class="inputs">
          <div class="filters">
            <button data-filter="none" class="active" type="button">Mặc định</button>
            <button data-filter="grayscale(1)" type="button">Đen trắng</button>
            <button data-filter="sepia(0.45) contrast(1.1) saturate(1.1)" type="button">Vintage</button>
            <button data-filter="brightness(1.2)" type="button">Tăng sáng</button>
            <button data-filter="contrast(1.4)" type="button">Tăng tương phản</button>
          </div>
          <div class="adjustments">
            <div class="range-row">
              <label>Zoom: <span id="zoomValue">1.0x</span></label>
              <input id="zoomRange" type="range" min="0.8" max="2.5" step="0.05" value="1" />
            </div>
            <div class="range-row">
              <label>Điều chỉnh vị trí</label>
              <input id="dragRangeX" type="range" min="-200" max="200" step="1" value="0" />
              <input id="dragRangeY" type="range" min="-200" max="200" step="1" value="0" />
            </div>
          </div>
        </div>
      </div>

      <aside class="photostrip">
        <div class="strip-card">
          <div class="strip-title">
            <h3>Photostrip</h3>
            <div class="layout-controls">
              <button data-layout="2" type="button">2 ảnh</button>
              <button data-layout="4" class="active" type="button">4 ảnh</button>
              <button data-layout="6" type="button">6 ảnh</button>
            </div>
          </div>
          <div class="caption-box">
            <label>Thêm Text</label>
            <input id="stripCaption" type="text" placeholder="Nhập caption cho strip" />
            <div class="hint">Ngày giờ sẽ tự động thêm khi xuất ảnh.</div>
          </div>
          <div id="photoList" class="strip-grid"></div>
        </div>
      </aside>
    </section>
  </div>

  <audio id="shutterSound" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAgAZGF0YUoAAAAA/////w=="></audio>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const modeWebcam = document.getElementById('modeWebcam');
    const modeUpload = document.getElementById('modeUpload');
    const captureBtn = document.getElementById('captureBtn');
    const uploadInput = document.getElementById('uploadInput');
    const rotateBtn = document.getElementById('rotateBtn');
    const resetBtn = document.getElementById('resetBtn');
    const downloadStrip = document.getElementById('downloadStrip');
    const deletePhoto = document.getElementById('deletePhoto');
    const layoutSelect = document.getElementById('layoutSelect');
    const stripCaption = document.getElementById('stripCaption');
    const captionText = document.getElementById('captionText');
    const photoList = document.getElementById('photoList');
    const countdownEl = document.getElementById('countdown');
    const flashEl = document.getElementById('flash');
    const shutterSound = document.getElementById('shutterSound');
    const filters = document.querySelectorAll('.filters button');
    const layoutButtons = document.querySelectorAll('.layout-controls button');
    const zoomRange = document.getElementById('zoomRange');
    const zoomValue = document.getElementById('zoomValue');
    const dragRangeX = document.getElementById('dragRangeX');
    const dragRangeY = document.getElementById('dragRangeY');

    let currentMode = 'webcam';
    let currentFilter = 'none';
    let currentIndex = -1;
    let rotation = 0;
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let isDragging = false;
    let dragStart = null;
    let photoItems = [];
    let stripLayout = 4;
    let videoStream = null;

    function setMode(mode) {
      currentMode = mode;
      modeWebcam.classList.toggle('active', mode === 'webcam');
      modeUpload.classList.toggle('active', mode === 'upload');
      captureBtn.textContent = mode === 'webcam' ? 'Chụp ảnh' : 'Upload ảnh';
      if (mode === 'webcam') {
        startWebcam();
        video.style.display = 'block';
      } else {
        stopWebcam();
        video.style.display = 'none';
      }
    }

    async function startWebcam() {
      if (videoStream) return;
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        video.srcObject = videoStream;
      } catch (err) {
        alert('Không thể truy cập webcam. Vui lòng kiểm tra quyền truy cập.');
      }
    }

    function stopWebcam() {
      if (!videoStream) return;
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }

    function updateCanvas() {
      const width = 720;
      const height = 960;
      canvas.width = width;
      canvas.height = height;
      ctx.save();
      ctx.fillStyle = '#191720';
      ctx.fillRect(0, 0, width, height);

      if (currentIndex < 0 || !photoItems[currentIndex]) {
        ctx.fillStyle = 'rgba(255,255,255,.12)';
        ctx.font = '600 24px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Chọn ảnh hoặc chụp từ webcam', width / 2, height / 2);
        ctx.restore();
        return;
      }

      const item = photoItems[currentIndex];
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#191720';
        ctx.fillRect(0, 0, width, height);
        ctx.filter = item.filter || 'none';
        ctx.translate(width / 2 + item.offsetX, height / 2 + item.offsetY);
        ctx.rotate((item.rotation || 0) * Math.PI / 180);
        const drawScale = item.scale || 1;
        ctx.scale(drawScale, drawScale);
        const ratio = Math.max(width / img.naturalWidth, height / img.naturalHeight);
        const drawW = img.naturalWidth * ratio;
        const drawH = img.naturalHeight * ratio;
        ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
        ctx.restore();
      };
      img.src = item.src;
    }

    function renderStrip() {
      photoList.innerHTML = '';
      const visible = photoItems.slice(0, stripLayout);
      visible.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'photo-item' + (index === currentIndex ? ' selected' : '');
        card.innerHTML = `
          <img src="${item.src}" alt="Ảnh ${index + 1}" />
          <div class="label">${index + 1}/${stripLayout}</div>
        `;
        card.addEventListener('click', () => selectPhoto(index));
        photoList.appendChild(card);
      });
      if (!visible.length) {
        const hint = document.createElement('div');
        hint.className = 'hint';
        hint.textContent = 'Hãy chụp hoặc upload ảnh để tạo photostrip.';
        photoList.appendChild(hint);
      }
    }

    function selectPhoto(index) {
      currentIndex = index;
      const item = photoItems[index];
      if (!item) return;
      currentFilter = item.filter || 'none';
      rotation = item.rotation || 0;
      scale = item.scale || 1;
      offsetX = item.offsetX || 0;
      offsetY = item.offsetY || 0;
      zoomRange.value = scale;
      zoomValue.textContent = `${scale.toFixed(2)}x`;
      dragRangeX.value = offsetX;
      dragRangeY.value = offsetY;
      filters.forEach(btn => btn.classList.toggle('active', btn.dataset.filter === currentFilter));
      renderStrip();
      updateCanvas();
    }

    function addPhoto(src) {
      photoItems.unshift({
        src,
        filter: 'none',
        rotation: 0,
        scale: 1,
        offsetX: 0,
        offsetY: 0
      });
      if (photoItems.length > 12) photoItems.pop();
      selectPhoto(0);
    }

    function captureSequence() {
      if (!videoStream) return;
      let shot = 0;
      const runCount = () => {
        if (shot >= 4) return;
        let count = 3;
        const tick = () => {
          if (count > 0) {
            countdownEl.textContent = count;
            countdownEl.classList.add('show');
            setTimeout(() => countdownEl.classList.remove('show'), 600);
            count -= 1;
            setTimeout(tick, 1000);
          } else {
            takePhoto();
            shot += 1;
            if (shot < 4) {
              setTimeout(runCount, 1400);
            }
          }
        };
        tick();
      };
      runCount();
    }

    function takePhoto() {
      shutterSound.currentTime = 0;
      shutterSound.play().catch(() => {});
      flashEl.classList.add('show');
      setTimeout(() => flashEl.classList.remove('show'), 220);
      const photoCanvas = document.createElement('canvas');
      const context = photoCanvas.getContext('2d');
      const width = video.videoWidth || 720;
      const height = video.videoHeight || 960;
      photoCanvas.width = width;
      photoCanvas.height = height;
      context.drawImage(video, 0, 0, width, height);
      addPhoto(photoCanvas.toDataURL('image/png'));
    }

    function applyCurrentChanges() {
      if (currentIndex < 0 || !photoItems[currentIndex]) return;
      const item = photoItems[currentIndex];
      item.filter = currentFilter;
      item.rotation = rotation;
      item.scale = parseFloat(scale);
      item.offsetX = offsetX;
      item.offsetY = offsetY;
      renderStrip();
      updateCanvas();
    }

    function exportStrip() {
      const visibleItems = photoItems.slice(0, stripLayout);
      if (!visibleItems.length) return alert('Chưa có ảnh để xuất.');
      const width = 720;
      const height = stripLayout * 480 + 140;
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = width;
      exportCanvas.height = height;
      const exportCtx = exportCanvas.getContext('2d');
      exportCtx.fillStyle = '#fff';
      exportCtx.fillRect(0, 0, width, height);
      const itemHeight = (height - 120 - 20 * (visibleItems.length - 1)) / visibleItems.length;
      visibleItems.forEach((item, idx) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = item.src;
        img.onload = () => {
          const y = 60 + idx * (itemHeight + 20);
          exportCtx.save();
          exportCtx.fillStyle = '#fff';
          exportCtx.fillRect(40, y, width - 80, itemHeight);
          exportCtx.strokeStyle = '#e9e2f9';
          exportCtx.lineWidth = 18;
          exportCtx.strokeRect(40, y, width - 80, itemHeight);
          exportCtx.beginPath();
          exportCtx.rect(40, y, width - 80, itemHeight);
          exportCtx.clip();
          exportCtx.filter = item.filter || 'none';
          const ratio = Math.max((width - 80) / img.naturalWidth, itemHeight / img.naturalHeight);
          const drawW = img.naturalWidth * ratio * item.scale;
          const drawH = img.naturalHeight * ratio * item.scale;
          const dx = 40 + ((width - 80) - drawW) / 2 + item.offsetX;
          const dy = y + (itemHeight - drawH) / 2 + item.offsetY;
          exportCtx.drawImage(img, dx, dy, drawW, drawH);
          exportCtx.restore();
          if (idx === visibleItems.length - 1) {
            exportCtx.fillStyle = '#111';
            exportCtx.font = '700 24px Inter, sans-serif';
            exportCtx.textAlign = 'left';
            exportCtx.fillText(new Date().toLocaleString('vi-VN'), 50, height - 50);
            exportCtx.fillText(stripCaption.value || 'Photobooth', 50, height - 20);
            const link = document.createElement('a');
            link.href = exportCanvas.toDataURL('image/png');
            link.download = `photostrip_${Date.now()}.png`;
            link.click();
          }
        };
      });
    }

    modeWebcam.addEventListener('click', () => setMode('webcam'));
    modeUpload.addEventListener('click', () => setMode('upload'));
    captureBtn.addEventListener('click', () => {
      if (currentMode === 'webcam') captureSequence();
      else uploadInput.click();
    });

    rotateBtn.addEventListener('click', () => {
      rotation = (rotation + 90) % 360;
      applyCurrentChanges();
    });

    resetBtn.addEventListener('click', () => {
      currentFilter = 'none';
      rotation = 0;
      scale = 1;
      offsetX = 0;
      offsetY = 0;
      zoomRange.value = 1;
      zoomValue.textContent = '1.00x';
      dragRangeX.value = 0;
      dragRangeY.value = 0;
      filters.forEach(btn => btn.classList.toggle('active', btn.dataset.filter === 'none'));
      applyCurrentChanges();
    });

    document.querySelector('label[for="uploadInput"]').addEventListener('click', () => {
      if (currentMode !== 'upload') setMode('upload');
    });

    uploadInput.addEventListener('change', (event) => {
      const files = Array.from(event.target.files);
      files.forEach(file => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = () => addPhoto(reader.result);
        reader.readAsDataURL(file);
      });
      uploadInput.value = '';
    });

    filters.forEach(btn => {
      btn.addEventListener('click', () => {
        filters.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        applyCurrentChanges();
      });
    });

    layoutButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        layoutButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        stripLayout = parseInt(btn.dataset.layout, 10);
        layoutSelect.value = stripLayout;
        renderStrip();
      });
    });

    layoutSelect.addEventListener('change', () => {
      stripLayout = parseInt(layoutSelect.value, 10);
      layoutButtons.forEach(btn => btn.classList.toggle('active', parseInt(btn.dataset.layout, 10) === stripLayout));
      renderStrip();
    });

    downloadStrip.addEventListener('click', exportStrip);
    deletePhoto.addEventListener('click', () => {
      if (currentIndex < 0) return;
      photoItems.splice(currentIndex, 1);
      currentIndex = Math.max(0, currentIndex - 1);
      renderStrip();
      updateCanvas();
    });

    zoomRange.addEventListener('input', () => {
      scale = parseFloat(zoomRange.value);
      zoomValue.textContent = `${scale.toFixed(2)}x`;
      applyCurrentChanges();
    });

    dragRangeX.addEventListener('input', () => {
      offsetX = parseInt(dragRangeX.value, 10);
      applyCurrentChanges();
    });

    dragRangeY.addEventListener('input', () => {
      offsetY = parseInt(dragRangeY.value, 10);
      applyCurrentChanges();
    });

    canvas.addEventListener('mousedown', (e) => {
      if (currentIndex < 0) return;
      isDragging = true;
      dragStart = { x: e.clientX, y: e.clientY, offsetX, offsetY };
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging || !dragStart) return;
      offsetX = dragStart.offsetX + (e.clientX - dragStart.x);
      offsetY = dragStart.offsetY + (e.clientY - dragStart.y);
      dragRangeX.value = offsetX;
      dragRangeY.value = offsetY;
      applyCurrentChanges();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      dragStart = null;
    });

    document.addEventListener('DOMContentLoaded', () => {
      setMode('webcam');
      renderStrip();
      updateCanvas();
    });

    window.addEventListener('beforeunload', stopWebcam);
  </script>
</body>
</html>
